<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="obsidianBg" cx="35%" cy="28%" r="85%">
      <stop offset="0%" stop-color="#1d202b" />
      <stop offset="55%" stop-color="#11131a" />
      <stop offset="100%" stop-color="#090a0e" />
    </radialGradient>

    <radialGradient id="goldAura" cx="48%" cy="52%" r="50%">
      <stop offset="0%" stop-color="#d4a373" stop-opacity="0.26" />
      <stop offset="55%" stop-color="#d4a373" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#d4a373" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="vinylBody" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#222531" />
      <stop offset="45%" stop-color="#12141c" />
      <stop offset="100%" stop-color="#0a0b10" />
    </linearGradient>

    <linearGradient id="vinylSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3efe9" stop-opacity="0.16" />
      <stop offset="40%" stop-color="#d4a373" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="champagneLabel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0dac0" />
      <stop offset="50%" stop-color="#d4a373" />
      <stop offset="100%" stop-color="#9e6d3f" />
    </linearGradient>

    <linearGradient id="tonearmGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f3efe9" />
      <stop offset="45%" stop-color="#d4a373" />
      <stop offset="100%" stop-color="#a67749" />
    </linearGradient>
  </defs>

  <!-- Arka Plan -->
  <rect width="512" height="512" fill="url(#obsidianBg)" />
  <circle cx="246" cy="264" r="230" fill="url(#goldAura)" />

  <!-- İnce Dergi Çerçevesi -->
  <rect x="20" y="20" width="472" height="472" rx="36" fill="none" stroke="#d4a373" stroke-opacity="0.2" stroke-width="2" />

  <!-- Sol Üst Minimalist Editoryal Mühür (Watermark) -->
  <g transform="translate(86 86)" opacity="0.65">
    <circle r="19" fill="#11131a" fill-opacity="0.7" stroke="#d4a373" stroke-width="1.6" />
    <circle r="15" fill="none" stroke="#f3efe9" stroke-opacity="0.24" stroke-width="0.9" />
    <circle r="2.2" fill="#d4a373" />
  </g>

  <!-- Plak Gövdesi -->
  <g transform="translate(242 266)">
    <circle r="172" fill="url(#vinylBody)" stroke="#d4a373" stroke-opacity="0.42" stroke-width="2.5" />

    <!-- Diagonal Işık Yansıması -->
    <path d="M -118 -118 A 168 168 0 0 1 118 -118 L 0 0 Z" fill="url(#vinylSheen)" />
    <path d="M 118 118 A 168 168 0 0 1 -118 118 L 0 0 Z" fill="url(#vinylSheen)" opacity="0.55" />

    <!-- Plak Olukları -->
    <circle r="150" fill="none" stroke="#f3efe9" stroke-opacity="0.11" stroke-width="1.5" />
    <circle r="132" fill="none" stroke="#d4a373" stroke-opacity="0.2" stroke-width="1.5" />
    <circle r="114" fill="none" stroke="#f3efe9" stroke-opacity="0.09" stroke-width="1.5" />
    <circle r="96" fill="none" stroke="#d4a373" stroke-opacity="0.18" stroke-width="1.5" />
    <circle r="78" fill="none" stroke="#f3efe9" stroke-opacity="0.12" stroke-width="1.5" />

    <!-- Merkez Şampanya Altın Etiket -->
    <circle r="56" fill="url(#champagneLabel)" />
    <circle r="48" fill="none" stroke="#0d0e12" stroke-opacity="0.24" stroke-width="1.5" />

    <!-- Etiket İçi Minimal Ses Dalgaları -->
    <rect x="-20" y="-11" width="4" height="22" rx="2" fill="#0d0e12" fill-opacity="0.35" />
    <rect x="-13" y="-17" width="4" height="34" rx="2" fill="#0d0e12" fill-opacity="0.45" />
    <rect x="9" y="-17" width="4" height="34" rx="2" fill="#0d0e12" fill-opacity="0.45" />
    <rect x="16" y="-11" width="4" height="22" rx="2" fill="#0d0e12" fill-opacity="0.35" />

    <!-- Merkez Mil -->
    <circle r="14" fill="#f3efe9" fill-opacity="0.85" />
    <circle r="9" fill="#0d0e12" />
  </g>

  <!-- Sağ Üst Minimal Pikap İğne Kolu (Tonearm) -->
  <g>
    <!-- Pivot Yatağı -->
    <circle cx="406" cy="116" r="28" fill="#171923" stroke="#d4a373" stroke-opacity="0.55" stroke-width="2.5" />
    <circle cx="406" cy="116" r="12" fill="url(#champagneLabel)" />

    <!-- Kol -->
    <path d="M 406 116 L 382 264 L 352 308" fill="none" stroke="url(#tonearmGold)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

    <!-- İğne Başlığı (Headshell) -->
    <g transform="translate(348 313) rotate(36)">
      <rect x="-8" y="-14" width="16" height="28" rx="4" fill="#f3efe9" stroke="#d4a373" stroke-width="2" />
      <circle cx="0" cy="6" r="2.5" fill="#0d0e12" />
    </g>
  </g>
</svg>
